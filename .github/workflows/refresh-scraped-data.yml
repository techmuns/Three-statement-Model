name: Refresh scraped data

# Scrapes Screener.in and commits the refreshed data/ back to main.
# (Cloudflare deployment is handled separately, outside this repo.)

on:
  # The underlying statements only change when companies report, so a few times
  # a week is plenty. Mon/Wed/Fri at 21:00 UTC ≈ 02:30 IST — after the day's
  # Indian filings are in, at a quiet hour.
  schedule:
    - cron: "0 21 * * 1,3,5"
  # Manual, on-demand runs from the Actions tab.
  workflow_dispatch:
    inputs:
      ticker:
        description: "One listed symbol to scrape on demand (e.g. SHAILY). Leave blank to run the normal staleness rotation."
        required: false
        type: string
      batch:
        description: "Bulk pre-load: how many companies to scrape this run, stalest (unscraped) first, in chunks committed as they finish. E.g. 500 for the whole NIFTY 500. Ignored if 'ticker' is set."
        required: false
        type: string

# The job commits refreshed data back to the repository.
permissions:
  contents: write

# Never let two refreshes run at once (they both push to main).
concurrency:
  group: refresh-scraped-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full NIFTY-500 pre-load runs a couple of hours; leave generous headroom
    # under the 6-hour job cap. Ordinary rotation runs finish in minutes.
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      # Modes:
      #   • ticker set  → scrape that one company, then commit.
      #   • batch set   → bulk pre-load: scrape `batch` companies in chunks of 25,
      #                   committing after each so progress survives a mid-run
      #                   failure and the site fills in gradually.
      #   • neither     → the normal staleness rotation (default batch size).
      # The scraper writes each file as it succeeds and exits non-zero only to
      # signal a failure; continue-on-error keeps us going and commits whatever
      # was produced. Stalest-first rotation means each chunk picks the next
      # unscraped / oldest companies, so chunks march through the universe.
      - name: Scrape Screener data and commit
        id: scrape
        continue-on-error: true
        working-directory: scraper
        env:
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          INPUT_TICKER: ${{ inputs.ticker }}
          INPUT_BATCH: ${{ inputs.batch }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          # This step's working-directory is scraper/, but the scraper writes the
          # JSON to data/ at the REPO ROOT — so every git operation must target the
          # root explicitly (git -C "$ROOT"), or `git add data/` looks for a
          # non-existent scraper/data/ and silently commits nothing.
          ROOT="${GITHUB_WORKSPACE}"
          git -C "${ROOT}" config user.name "github-actions[bot]"
          git -C "${ROOT}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit any new data/ files and push, with a few network retries. A
          # push race (or nothing to commit) is tolerated so scraping continues.
          commit_data() {
            git -C "${ROOT}" add data/ || return 0
            if git -C "${ROOT}" diff --cached --quiet; then
              echo "No new data to commit."
              return 0
            fi
            git -C "${ROOT}" commit -m "chore: refresh scraped financial data" || return 0
            for attempt in 1 2 3 4; do
              if git -C "${ROOT}" push origin "HEAD:${BRANCH}"; then
                echo "Pushed refreshed data to ${BRANCH}."
                return 0
              fi
              echo "Push failed (attempt ${attempt}); rebasing on ${BRANCH} and retrying…"
              git -C "${ROOT}" pull --rebase origin "${BRANCH}" || true
              sleep 3
            done
            echo "::error::Could not push scraped data to ${BRANCH} after retries."
            return 1
          }

          rc=0
          if [ -n "${INPUT_TICKER}" ]; then
            echo "On-demand scrape: ${INPUT_TICKER}"
            npm run scrape -- --company="${INPUT_TICKER}" || rc=$?
            commit_data || true
          elif [ -n "${INPUT_BATCH}" ]; then
            echo "Bulk pre-load: up to ${INPUT_BATCH} companies, in chunks of 25 (commit after each)."
            remaining="${INPUT_BATCH}"
            chunk=25
            while [ "${remaining}" -gt 0 ]; do
              size=${chunk}
              [ "${remaining}" -lt "${chunk}" ] && size=${remaining}
              echo "── Chunk: scraping ${size} (≈${remaining} to go) ──"
              npm run scrape:rotate -- --batch="${size}" || rc=$?
              commit_data || true
              remaining=$((remaining - size))
            done
          else
            echo "Staleness rotation scrape"
            npm run scrape:rotate || rc=$?
            commit_data || true
          fi
          # Surface scrape failures as a red step (see the next step) while still
          # having committed everything that succeeded above.
          exit "${rc}"

      # Turn the run red if scraping errored, so GitHub's failure notification
      # reaches us — a signal that Screener's page structure may have drifted (or
      # a login/credential problem). Any companies that did succeed above were
      # still committed inside the previous step.
      - name: Fail the run if scraping errored
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::The scrape step failed — see the 'Scrape Screener data and commit' step logs. Screener's page structure may have drifted, or there was a login/credential problem."
          exit 1
