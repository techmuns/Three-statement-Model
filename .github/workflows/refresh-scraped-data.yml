name: Refresh scraped data

# Scrapes Screener.in and commits the refreshed data/ back to main.
# (Cloudflare deployment is handled separately, outside this repo.)

on:
  # The underlying statements only change when companies report, so a few times
  # a week is plenty. Mon/Wed/Fri at 21:00 UTC ≈ 02:30 IST — after the day's
  # Indian filings are in, at a quiet hour.
  schedule:
    - cron: "0 21 * * 1,3,5"
  # Manual, on-demand runs from the Actions tab.
  workflow_dispatch:
    inputs:
      ticker:
        description: "One listed symbol to scrape on demand (e.g. SHAILY). Leave blank to run the normal staleness rotation."
        required: false
        type: string

# The job commits refreshed data back to the repository.
permissions:
  contents: write

# Never let two refreshes run at once (they both push to main).
concurrency:
  group: refresh-scraped-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      # On-demand: if a ticker was supplied to workflow_dispatch, scrape just
      # that one company (any listed symbol, registry member or not). Otherwise
      # run the staleness rotation over the active universe (stalest first, so
      # coverage builds up and then recycles to whatever is oldest). Either way
      # the scraper writes each file as it succeeds and exits non-zero only to
      # signal a failure, so we continue and commit whatever was produced.
      - name: Scrape Screener data
        id: scrape
        continue-on-error: true
        working-directory: scraper
        env:
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
          # Optional: enables automatic BSE segment-mix discovery. Without it,
          # segment mix stays an honest "not reported" and nothing else changes.
          SCRAPEDO_API_KEY: ${{ secrets.SCRAPEDO_API_KEY }}
          INPUT_TICKER: ${{ inputs.ticker }}
        run: |
          if [ -n "$INPUT_TICKER" ]; then
            echo "On-demand scrape: $INPUT_TICKER"
            npm run scrape -- --company="$INPUT_TICKER"
          else
            echo "Staleness rotation scrape"
            npm run scrape:rotate
          fi

      - name: Commit and push refreshed data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes in data/ — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh scraped financial data"
          if git push origin "HEAD:${BRANCH}"; then
            echo "Refreshed data committed and pushed to ${BRANCH}."
          else
            echo "::error::Push to ${BRANCH} was rejected. Most likely branch protection is blocking the github-actions bot's direct push (or the branch advanced during the run). Either allow the bot to bypass protection, or switch this workflow to open a pull request instead."
            exit 1
          fi

      # Turn the run red if scraping errored, so GitHub's failure notification
      # reaches us — a signal that Screener's page structure may have drifted (or
      # a login/credential problem). Any companies that did succeed above were
      # still committed.
      - name: Fail the run if scraping errored
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::The scrape step failed — see the 'Scrape Screener data' step logs. Screener's page structure may have drifted, or there was a login/credential problem."
          exit 1
